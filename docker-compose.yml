# ronw-planner with Docker Compose
#
#   docker compose up -d --build
#
# Accounts and guild data are kept in ./data next to this file (users.json and guilds/).
# Settings come from .env (see .env.example).

services:
  app:
    build: .
    image: ronw-planner
    container_name: ronw-planner
    restart: unless-stopped
    environment:
      # 1 = a web server or tunnel sits in front and passes the visitor's IP and HTTPS.
      # Set 0 if visitors connect to the app's port directly.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - ./data:/data
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-4747}:4747"
